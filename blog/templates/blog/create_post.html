<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New Blog Post</title>
</head>
<body>
    <h1>✍️ নতুন ব্লগ পোস্ট তৈরি করুন (AI-Powered)</h1>
    <hr>
    
    <!-- ফর্মের মেথড POST এবং এটি সাবমিট হলে আমাদের জ্যাঙ্গো কন্ট্রোলারে যাবে -->
    <form method="POST">
        <!-- লারাভেলের @csrf এর পাইথনিক রূপ হলো এটি, এটি ছাড়া জ্যাঙ্গো ফর্ম সাবমিট নেবে না -->
        {% csrf_token %}
        
        <div style="margin-bottom: 15px;">
            <label><b>পোস্টের টাইটেল:</b></label><br>
            <input type="text" name="title" required style="width: 400px; padding: 5px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label><b>মূল কন্টেন্ট বা লেখা:</b></label><br>
            <textarea name="content" required rows="6" style="width: 400px; padding: 5px;" placeholder="লেখা বড় হলে AI অটো সামারি বানিয়ে দেবে। 'spam' বা 'click here' শব্দ থাকলে AI এটিকে ব্লক বা স্প্যাম মার্ক করবে।"></textarea>
        </div>
        
        <button type="submit" style="padding: 8px 20px; background-color: green; color: white; border: none; cursor: pointer;">
            পোস্ট করুন 🚀
        </button>
    </form>
    
    <br>
    <a href="{% url 'customer_posts' %}">◀ ব্যাক টু পোর্টাল</a>
</body>
</html>
