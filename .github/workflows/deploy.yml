name: CI/CD Production Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies & Run Tests
      run: |
        pip install -r requirements.txt
        python manage.py check

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Images
      run: |
        docker build -t rokibol/django-app:latest -f Django.Dockerfile .
        docker build -t rokibol/fastapi-ai:latest -f FastAPI.Dockerfile .
        docker push rokibol/django-app:latest
        docker push rokibol/fastapi-ai:latest

  deploy:
    needs: test_and_build
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Live Cloud Server via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          mkdir -p /root/apps/py-blog
          cd /root/apps/py-blog
          
          cat << 'EOF' > docker-compose.yml
          version: '3.8'

          services:
            django_web:
              image: rokibol/django-app:latest
              build:
                context: .
                dockerfile: Django.Dockerfile
              ports:
                - "8002:8002"
              environment:
                - PYTHONUNBUFFERED=1
              depends_on:
                - fastapi_ai

            fastapi_ai:
              image: rokibol/fastapi-ai:latest
              build:
                context: .
                dockerfile: FastAPI.Dockerfile
              ports:
                - "8003:8003"
              extra_hosts:
                - "host.docker.internal:host-gateway"
          EOF
          
          docker compose pull
          docker compose up -d --remove-orphans

